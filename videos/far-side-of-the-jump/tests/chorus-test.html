<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Far Side of the Jump: chorus motion test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; font-weight: 900; font-style: normal; src: url("assets/fonts/fraunces-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Fraunces"; font-weight: 900; font-style: italic; src: url("assets/fonts/fraunces-latin-900-italic.woff2") format("woff2"); }
      @font-face { font-family: "Fraunces"; font-weight: 600; font-style: normal; src: url("assets/fonts/fraunces-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Space Mono"; font-weight: 400; src: url("assets/fonts/space-mono-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Space Mono"; font-weight: 700; src: url("assets/fonts/space-mono-latin-700-normal.woff2") format("woff2"); }

      :root {
        --paper: #fcfbf8; --ink: #33251e; --teal: #167d78; --teal-dark: #105e5a;
        --apricot: #d88a57; --sun: #f2c14e; --soft: #eff6f3;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Fraunces", Georgia, serif; color: var(--ink); }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* painted world */
      .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .rider-wrap { position: absolute; inset: 0; transform-origin: 45% 45%; }
      .grade { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 90% at 50% 40%, rgba(255,220,160,0) 55%, rgba(80,40,20,0.35) 100%); }
      .grain { position: absolute; inset: -20px; opacity: 0.10; mix-blend-mode: multiply; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

      /* lyrics */
      .lyric { position: absolute; left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 0 0.36em; text-align: center; }
      .lyric .w { display: inline-block; }
      .big { top: 40px; font-weight: 900; font-size: 116px; line-height: 1; color: var(--paper);
        text-shadow: 0 6px 0 var(--ink), 0 10px 30px rgba(51,37,30,0.45); letter-spacing: -0.01em; }
      .mid { bottom: 90px; font-weight: 900; font-style: italic; font-size: 84px; line-height: 1.05; color: var(--paper);
        text-shadow: 0 5px 0 var(--ink), 0 8px 24px rgba(51,37,30,0.5); }
      .ink { color: var(--ink); text-shadow: none; }
      .hup { position: absolute; left: 1290px; top: 380px; width: 420px; height: 220px; display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 170px; color: var(--apricot); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; transform-origin: 50% 50%; }

      /* hoofprint counter */
      .hoof { position: absolute; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center;
        font-family: "Space Mono", monospace; font-weight: 700; font-size: 48px; color: var(--ink); padding-top: 34px; }
      .hoof svg { position: absolute; inset: 0; }
      .hoof span { position: relative; }

      /* sightline */
      #sight { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      /* glass garden (coded) */
      .paper { position: absolute; inset: 0; background:
        radial-gradient(60% 55% at 50% 62%, #ffffff 0%, var(--paper) 55%, #f3efe6 100%); }
      .tree { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .label { position: absolute; font-family: "Space Mono", monospace; font-weight: 700; font-size: 22px; letter-spacing: 0.06em;
        color: var(--teal-dark); background: rgba(252,251,248,0.92); border: 2px solid var(--teal); border-radius: 999px; padding: 6px 16px; white-space: nowrap; }
      .label b { color: var(--apricot); }
      .garden-lyric { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 76px; line-height: 1.05; color: var(--ink); }
      .petal { position: absolute; width: 26px; height: 18px; border-radius: 60% 40% 60% 40%; background: linear-gradient(135deg, #f6c39b, var(--apricot)); opacity: 0; }
      .flash { position: absolute; inset: 0; background: #fffaf0; opacity: 0; pointer-events: none; }
      .endcard { position: absolute; right: 70px; bottom: 60px; text-align: right; font-family: "Space Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; color: var(--teal-dark); }
      .title-card { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font-weight: 900; font-style: italic; font-size: 92px; color: var(--ink); }
    </style>
  </head>
  <body>
    <!-- Track window 57.12s to 77.53s of the song (pre-chorus count into chorus 1). Local t = track t - 57.12 -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.41" data-width="1920" data-height="1080">

      <audio id="bgm" src="assets/bgm.mp3" data-start="0" data-duration="20.41" data-media-start="57.12" data-track-index="11" data-volume="1"></audio>

      <!-- S1 approach: 0 to 3.58 -->
      <section id="s1" class="clip" data-start="0" data-duration="3.58" data-track-index="0">
        <div class="cam" id="s1-cam">
          <img class="layer" id="s1-bg" src="assets/jump/L0-background.png" alt="" />
          <div class="rider-wrap" id="s1-rider"><img class="layer" src="assets/jump/L1b-rider-approach.png" alt="" /></div>
          <img class="layer" id="s1-pole" src="assets/jump/L2-pole.png" alt="" />
          <img class="layer" id="s1-front" src="assets/jump/L3-foreground-flowers.png" alt="" />
        </div>
        <svg id="sight" viewBox="0 0 1920 1080"><path id="sight-path" d="M 700 420 C 960 230, 1300 220, 1560 380" fill="none" stroke="#fcfbf8" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22" /></svg>
        <div id="hoofs"></div>
        <div class="lyric mid" id="l-where"><span class="w">Where</span><span class="w">you</span><span class="w">look…</span></div>
        <div class="grade"></div>
      </section>

      <!-- S2 jump: 3.58 to 7.38 -->
      <section id="s2" class="clip" data-start="3.58" data-duration="3.8" data-track-index="0">
        <div class="cam" id="s2-shake"><div class="cam" id="s2-cam">
          <img class="layer" id="s2-bg" src="assets/jump/L0-background.png" alt="" />
          <img class="layer" id="s2-pole" src="assets/jump/L2-pole.png" alt="" />
          <div class="rider-wrap" id="s2-rider"><img class="layer" src="assets/jump/L1-rider.png" alt="" /></div>
          <img class="layer" id="s2-front" src="assets/jump/L3-foreground-flowers.png" alt="" />
        </div></div>
        <div id="s2-petals"></div>
        <div class="lyric big" id="l-eyes1"><span class="w">Eyes</span><span class="w">on</span><span class="w">the</span><span class="w">far</span><span class="w">side!</span></div>
        <div class="hup" id="hup1">HUP!</div>
        <div class="lyric mid" id="l-ride1"><span class="w">Ride</span><span class="w">the</span><span class="w">approach!</span></div>
        <div class="grade"></div>
      </section>

      <!-- S3 coded glass tree: 7.38 to 11.28 -->
      <section id="s3" class="clip" data-start="7.38" data-duration="3.9" data-track-index="0">
        <div class="paper"></div>
        <svg class="tree" id="tree-a" viewBox="0 0 1920 1080"></svg>
        <div id="labels-a"></div>
        <div class="garden-lyric" id="l-some1" style="top:60px"><span>Somewhere somebody found a way,</span></div>
        <div class="garden-lyric" id="l-some2" style="top:60px"><span>somebody’s finding it <i>today!</i></span></div>
      </section>

      <!-- S4 second jump, tighter: 11.28 to 14.88 -->
      <section id="s4" class="clip" data-start="11.28" data-duration="3.6" data-track-index="0">
        <div class="cam" id="s4-shake"><div class="cam" id="s4-cam">
          <img class="layer" src="assets/jump/L0-background.png" alt="" />
          <img class="layer" id="s4-pole" src="assets/jump/L2-pole.png" alt="" />
          <div class="rider-wrap" id="s4-rider"><img class="layer" src="assets/jump/L1-rider.png" alt="" /></div>
          <img class="layer" id="s4-front" src="assets/jump/L3-foreground-flowers.png" alt="" />
        </div></div>
        <div id="s4-petals"></div>
        <div class="lyric big" id="l-eyes2"><span class="w">Eyes</span><span class="w">on</span><span class="w">the</span><span class="w">far</span><span class="w">side!</span></div>
        <div class="hup" id="hup2">HUP!</div>
        <div class="lyric mid" id="l-ride2"><span class="w">Ride</span><span class="w">the</span><span class="w">approach!</span></div>
        <div class="grade"></div>
      </section>

      <!-- S5 don't stare / look past: 14.88 to 18.53 -->
      <section id="s5" class="clip" data-start="14.88" data-duration="3.65" data-track-index="0">
        <div class="cam" id="s5-cam">
          <img class="layer" src="assets/jump/L0-background.png" alt="" />
          <div id="s5-polebox" style="position:absolute;inset:0;transform-origin:50% 75%">
            <img class="layer" src="assets/jump/L2-pole.png" alt="" />
            <svg id="mouth" viewBox="0 0 1920 1080" style="position:absolute;inset:0;width:1920px;height:1080px">
              <g id="mouth-g" transform="translate(700 812)">
                <path id="jaw-top" d="M -120 0 Q 0 -70 120 0 Z" fill="#33251e" />
                <path id="jaw-bot" d="M -120 0 Q 0 80 120 0 Z" fill="#33251e" />
                <g fill="#fcfbf8"><path d="M -90 -4 l 14 22 l 14 -22 Z" /><path d="M -30 -4 l 14 24 l 14 -24 Z" /><path d="M 30 -4 l 14 24 l 14 -24 Z" /></g>
                <circle cx="-60" cy="-70" r="20" fill="#fcfbf8" stroke="#33251e" stroke-width="6" /><circle cx="-56" cy="-66" r="8" fill="#33251e" />
                <circle cx="60" cy="-70" r="20" fill="#fcfbf8" stroke="#33251e" stroke-width="6" /><circle cx="56" cy="-66" r="8" fill="#33251e" />
              </g>
            </svg>
          </div>
        </div>
        <div class="rider-wrap" id="s5-rider"><img class="layer" src="assets/jump/L1-rider.png" alt="" /></div>
        <div class="lyric mid" id="l-stare"><span class="w">Don’t</span><span class="w">stare</span><span class="w">at</span><span class="w">the</span><span class="w">fence,</span></div>
        <div class="lyric mid" id="l-fear"><span class="w">don’t</span><span class="w">fear</span><span class="w">the</span><span class="w">fall,</span></div>
        <div class="lyric big" id="l-past"><span class="w">Look</span><span class="w">past</span><span class="w">the</span><span class="w">jump…</span></div>
        <div class="lyric mid" id="l-clear"><span class="w">and</span><span class="w">you</span><span class="w">clear</span><span class="w">it</span><span class="w">all!</span></div>
        <div class="grade"></div>
      </section>

      <!-- S6 bloom tail: 18.53 to 20.41 -->
      <section id="s6" class="clip" data-start="18.53" data-duration="1.88" data-track-index="0">
        <div class="paper"></div>
        <svg class="tree" id="tree-b" viewBox="0 0 1920 1080"></svg>
        <div id="s6-petals"></div>
        <div class="title-card" id="s6-title">Far Side of the Jump</div>
        <div class="endcard" id="s6-url">KHAYALI.XYZ/UTOPAI</div>
        <div class="flash" id="s6-flash"></div>
      </section>

      <div class="grain clip" data-start="0" data-duration="20.41" data-track-index="5"></div>
    </div>

    <script>
      // ---------- deterministic helpers ----------
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const SVGNS = "http://www.w3.org/2000/svg";
      function el(tag, attrs, parent) { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }

      // ---------- glass tree generator ----------
      function buildTree(svg, seed, scale) {
        const R = rng(seed);
        const defs = el("defs", {}, svg);
        const glow = el("filter", { id: svg.id + "-glow", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
        el("feGaussianBlur", { stdDeviation: "6", result: "b" }, glow);
        const m = el("feMerge", {}, glow); el("feMergeNode", { in: "b" }, m); el("feMergeNode", { in: "SourceGraphic" }, m);
        const bud = el("radialGradient", { id: svg.id + "-bud", cx: "40%", cy: "35%", r: "65%" }, defs);
        el("stop", { offset: "0%", "stop-color": "#fff4e6" }, bud); el("stop", { offset: "45%", "stop-color": "#f3b383" }, bud); el("stop", { offset: "100%", "stop-color": "#c9703f" }, bud);
        const halo = el("radialGradient", { id: svg.id + "-halo" }, defs);
        el("stop", { offset: "0%", "stop-color": "#f6c39b", "stop-opacity": "0.75" }, halo); el("stop", { offset: "100%", "stop-color": "#f6c39b", "stop-opacity": "0" }, halo);

        el("ellipse", { cx: 960, cy: 1000, rx: 520 * scale, ry: 34, fill: "#167d78", opacity: "0.10" }, svg);
        const gBranch = el("g", { filter: `url(#${svg.id}-glow)`, "stroke-linecap": "round", fill: "none" }, svg);
        const gBud = el("g", {}, svg);
        const branches = [], buds = [];
        function seg(d, w, depth) {
          const g = el("g", {}, gBranch);
          const body = el("path", { d, stroke: "#8fd3c3", "stroke-width": w, opacity: "0.5" }, g);
          const core = el("path", { d, stroke: "#167d78", "stroke-width": Math.max(1.5, w * 0.42), opacity: "0.8" }, g);
          const hi = el("path", { d, stroke: "#ffffff", "stroke-width": Math.max(1, w * 0.16), opacity: "0.85", transform: `translate(${(-w * 0.2).toFixed(1)} ${(-w * 0.1).toFixed(1)})` }, g);
          branches.push({ paths: [body, core, hi], depth });
        }
        function addBud(x, y, r) {
          const h = el("circle", { cx: x, cy: y, r: r * 2.6, fill: `url(#${svg.id}-halo)`, opacity: 0 }, gBud);
          const b = el("circle", { cx: x, cy: y, r, fill: `url(#${svg.id}-bud)`, stroke: "#b8643a", "stroke-width": 1.2 }, gBud);
          buds.push({ b, h, x, y });
        }
        function grow(x, y, ang, len, w, depth) {
          const bend = (R() - 0.5) * 0.5;
          const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
          const cx = x + Math.cos(ang + bend) * len * 0.55, cy = y + Math.sin(ang + bend) * len * 0.55;
          seg(`M ${x.toFixed(1)} ${y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`, w, depth);
          if (depth >= 4 && R() < 0.4) addBud(cx, cy, 8 + R() * 6);
          if (depth >= 6) { addBud(x2, y2, 13 + R() * 11); return; }
          const spread = depth < 2 ? 0.7 : 0.52;
          // pull every branch gently back toward upright so the crown stays round and balanced
          const upright = -Math.PI / 2, pull = (upright - ang) * 0.08;
          grow(x2, y2, ang - spread + pull + (R() - 0.5) * 0.2, len * (0.74 + R() * 0.08), w * 0.68, depth + 1);
          grow(x2, y2, ang + spread + pull + (R() - 0.5) * 0.2, len * (0.74 + R() * 0.08), w * 0.68, depth + 1);
          if (depth >= 2 && depth <= 4 && R() < 0.3) grow(x2, y2, ang + pull + (R() - 0.5) * 0.3, len * 0.62, w * 0.6, depth + 1);
        }
        // twisted twin trunk: two glass strands braiding upward
        const tx = 960, base = 1000, top = 1000 - 230 * scale;
        seg(`M ${tx - 60} ${base} C ${tx + 50} ${base - 80}, ${tx - 70} ${base - 150}, ${tx} ${top}`, 74 * scale, 0);
        seg(`M ${tx + 60} ${base} C ${tx - 50} ${base - 90}, ${tx + 70} ${base - 160}, ${tx} ${top}`, 62 * scale, 0);
        grow(tx, top, -Math.PI / 2 - 0.85, 170 * scale, 42 * scale, 1);
        grow(tx, top, -Math.PI / 2 + 0.85, 170 * scale, 42 * scale, 1);
        grow(tx, top, -Math.PI / 2, 130 * scale, 34 * scale, 2);
        branches.forEach(o => o.paths.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }));
        return { branches, buds };
      }

      // ---------- petals ----------
      function makePetals(host, n, seed) {
        const R = rng(seed), out = [];
        for (let i = 0; i < n; i++) { const p = document.createElement("div"); p.className = "petal"; host.appendChild(p);
          out.push({ p, x: R() * 1920, y: R() * 1080, dx: 200 + R() * 500, dy: -150 + R() * 450, r: R() * 720 - 360, s: 0.6 + R() * 1.1 }); }
        return out;
      }
      function burst(tl, petals, at, dur) {
        petals.forEach((o, i) => {
          tl.fromTo(o.p, { x: o.x - 300, y: o.y, rotation: 0, scale: o.s, opacity: 0 },
            { x: o.x - 300 + o.dx, y: o.y + o.dy, rotation: o.r, opacity: 0.95, duration: dur, ease: "sine.out" }, at + (i % 7) * 0.03);
        });
      }
      function words(tl, sel, times, from) {
        document.querySelectorAll(sel + " .w").forEach((w, i) =>
          tl.fromTo(w, from || { y: 50, opacity: 0, scale: 0.6 }, { y: 0, opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.6)" }, times[i]));
      }

      // ---------- build ----------
      const tl = gsap.timeline({ paused: true });

      // S1: approach + canter count (track 57.4 .. 59.4 => local .28 .. 2.28)
      tl.fromTo("#s1-cam", { scale: 1.08, x: 40 }, { scale: 1.16, x: -30, duration: 3.58, ease: "none" }, 0);
      tl.fromTo("#s1-rider", { x: -760, y: 230, scale: 0.55 }, { x: -260, y: 230, scale: 0.55, duration: 3.58, ease: "none" }, 0);
      tl.fromTo("#s1-pole", { x: 0 }, { x: -60, duration: 3.58, ease: "none" }, 0);
      tl.fromTo("#s1-front", { x: 0, y: 30 }, { x: -160, y: 30, duration: 3.58, ease: "none" }, 0);
      const counts = [0.28, 0.78, 1.18, 1.68, 1.98, 2.28];
      counts.forEach(t => { // canter bob: lift on each count
        tl.to("#s1-rider", { y: 204, rotation: -1.2, duration: 0.12, ease: "power2.out" }, t);
        tl.to("#s1-rider", { y: 230, rotation: 0.6, duration: 0.2, ease: "power2.in" }, t + 0.12);
      });
      const hoofHost = document.getElementById("hoofs");
      const hoofPath = "M 22 14 C 8 50 10 96 40 112 C 52 118 68 118 80 112 C 110 96 112 50 98 14 L 78 14 C 90 46 88 84 70 94 C 64 98 56 98 50 94 C 32 84 30 46 42 14 Z";
      counts.forEach((t, i) => {
        const h = document.createElement("div"); h.className = "hoof";
        h.style.left = (520 + i * 170) + "px"; h.style.top = (i % 3 === 1 ? 110 : 150) + "px";
        h.innerHTML = `<svg viewBox="0 0 120 120"><path d="${hoofPath}" fill="#d88a57" stroke="#33251e" stroke-width="6" stroke-linejoin="round"/><g fill="#33251e"><circle cx="24" cy="40" r="4"/><circle cx="26" cy="70" r="4"/><circle cx="96" cy="40" r="4"/><circle cx="94" cy="70" r="4"/></g></svg><span>${(i % 3) + 1}</span>`;
        hoofHost.appendChild(h);
        tl.fromTo(h, { scale: 2.2, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.14, ease: "power4.in" }, t);
      });
      const sp = document.getElementById("sight-path"); const SL = sp.getTotalLength();
      tl.fromTo(sp, { strokeDashoffset: SL, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.9, ease: "power2.out" }, 2.5);
      sp.style.strokeDasharray = "2 22";
      words(tl, "#l-where", [2.58, 2.86, 3.08]);

      // S2: the jump (local 3.58 .. 7.38)
      const s2 = 3.58;
      tl.fromTo("#s2-cam", { scale: 1.06, y: 40 }, { scale: 1.18, y: -40, duration: 3.8, ease: "power1.out" }, s2);
      tl.fromTo("#s2-rider", { y: 260, x: -300, rotation: 8, scale: 0.58 }, { y: 70, x: -120, rotation: -2, scale: 0.58, duration: 0.9, ease: "power2.out" }, s2);
      tl.to("#s2-rider", { y: 40, x: 20, rotation: -4, duration: 2.0, ease: "sine.inOut" }, s2 + 0.9);
      tl.to("#s2-rider", { y: 200, x: 160, rotation: 4, duration: 0.9, ease: "power2.in" }, s2 + 2.9);
      tl.fromTo("#s2-pole", { y: 0 }, { y: 70, duration: 3.8, ease: "power1.out" }, s2);
      tl.fromTo("#s2-front", { y: 0 }, { y: 140, duration: 3.8, ease: "power1.out" }, s2);
      burst(tl, makePetals(document.getElementById("s2-petals"), 34, 11), s2 + 0.1, 3.4);
      words(tl, "#l-eyes1", [3.58, 3.84, 3.98, 4.14, 4.36], { y: -80, opacity: 0, scale: 1.6 });
      tl.fromTo("#hup1", { scale: 3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.16, ease: "power4.in" }, 5.25);
      tl.to("#s2-shake", { x: 14, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 5.41);
      tl.to("#hup1", { scale: 0.9, opacity: 0, duration: 0.3 }, 5.95);
      tl.to("#l-eyes1", { opacity: 0, y: -40, duration: 0.25 }, 5.85);
      words(tl, "#l-ride1", [5.98, 6.38, 6.68]);

      // S3: coded glass tree (local 7.38 .. 11.28)
      const A = buildTree(document.getElementById("tree-a"), 42, 1.0);
